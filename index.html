<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF RAG Chatbot</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; line-height: 1.6; }
        #chat-box { height: 400px; border: 1px solid #ccc; border-radius: 8px; padding: 15px; overflow-y: auto; margin-bottom: 20px; background-color: #f9f9f9; }
        .message { margin-bottom: 15px; padding: 10px 15px; border-radius: 18px; max-width: 80%; word-wrap: break-word; }
        .user-msg { background-color: #007bff; color: white; margin-left: auto; border-bottom-right-radius: 2px; }
        .bot-msg { background-color: #e9ecef; color: black; margin-right: auto; border-bottom-left-radius: 2px; }
        .input-area { display: flex; gap: 10px; }
        input[type="text"] { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; }
        button { padding: 10px 20px; border: none; background-color: #007bff; color: white; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #0056b3; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        .thinking { font-style: italic; color: #666; font-size: 0.9em; margin-left: 10px; display: none; }
    </style>
</head>
<body>
    <h1>📚 Ask My PDF Chatbot</h1>
    <p>Ask a question about the 'company_handbook.pdf' document.</p>

    <div id="chat-box">
        <div class="message bot-msg">Hello! I'm ready to answer questions about the PDF. What would you like to know?</div>
    </div>

    <div class="input-area">
        <input type="text" id="question-input" placeholder="Type your question..." autocomplete="off" />
        <button id="send-button" onclick="askQuestion()">Send</button>
    </div>
    <div id="thinking-indicator" class="thinking">Thinking...</div>

    <script>
        const chatBox = document.getElementById('chat-box');
        const questionInput = document.getElementById('question-input');
        const sendButton = document.getElementById('send-button');
        const thinkingIndicator = document.getElementById('thinking-indicator');

        // Allow pressing Enter to send
        questionInput.addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                event.preventDefault();
                askQuestion();
            }
        });

        function appendMessage(text, sender) {
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message ' + (sender === 'user' ? 'user-msg' : 'bot-msg');
            msgDiv.innerText = text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight; // Auto-scroll to bottom
        }

        async function askQuestion() {
            const question = questionInput.value.trim();
            if (!question) return;

            // Update UI
            appendMessage(question, 'user');
            questionInput.value = '';
            questionInput.disabled = true;
            sendButton.disabled = true;
            thinkingIndicator.style.display = 'block';

            try {
                // Send the question to our Flask backend
                const response = await fetch('/ask', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question: question })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    appendMessage(data.answer, 'bot');
                } else {
                    appendMessage('Error: ' + (data.error || 'Something went wrong.'), 'bot');
                }
            } catch (error) {
                appendMessage('Error connecting to the server. Is it running?', 'bot');
                console.error(error);
            } finally {
                // Restore UI
                questionInput.disabled = false;
                sendButton.disabled = false;
                thinkingIndicator.style.display = 'none';
                questionInput.focus();
            }
        }
    </script>
</body>
</html>
